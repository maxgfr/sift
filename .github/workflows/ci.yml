name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # All four are real targets, not aspirations: the measurement layer has a
        # per-OS implementation behind `sift_core::platform`, and each has its own way to
        # be wrong. Windows in particular enforces at runtime what the others tolerate
        # silently — unbuffered reads reject unaligned offsets outright — so a green
        # Windows job is the strongest single signal that the read path is correct.
        #
        # `windows-11-arm` is here so the ARM64 binary the release workflow ships is one
        # whose tests have actually run on that hardware. Building for a target nobody has
        # executed is how an unstartable binary reaches users through Homebrew.
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
