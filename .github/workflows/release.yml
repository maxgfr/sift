name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sift-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sift-macos-x64
          # 22.04 rather than latest, deliberately: it links against glibc 2.35, which
          # runs on Ubuntu 22.04+, Debian 12+ and Fedora 36+. A binary built on 24.04
          # needs glibc 2.39 and refuses to start on anything older.
          #
          # musl would sidestep glibc entirely, and is the wrong answer *for this tool*:
          # its memcpy is materially slower than glibc's on large copies, and a slower
          # memcpy makes `doctor` report a slower machine. A measurement tool must not
          # ship a build that lies about the hardware.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: sift-linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: sift-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sift-windows-x64.exe
          # Built on the ARM runner rather than cross-compiled from x64, so the smoke test
          # below runs the binary on the architecture it ships for. The same runner runs
          # the full test suite in ci.yml, which is what took this row off the "unverified,
          # so not shipped" list.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: sift-windows-arm64.exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin sift --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/sift.exe" "${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/sift" "${{ matrix.artifact }}"
          fi

      # A binary that cannot start is worse than a missing one — Homebrew would install it
      # and every user would hit the failure instead of us. Skipped where the runner
      # architecture differs from the target, since it could not run there anyway.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          chmod +x "${{ matrix.artifact }}" || true
          "./${{ matrix.artifact }}" --version
          "./${{ matrix.artifact }}" engines

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  upload:
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload binaries to release
        run: |
          TAG="v${{ needs.release.outputs.version }}"
          gh release upload "$TAG" \
            artifacts/sift-macos-arm64/sift-macos-arm64 \
            artifacts/sift-macos-x64/sift-macos-x64 \
            artifacts/sift-linux-x64/sift-linux-x64 \
            artifacts/sift-linux-arm64/sift-linux-arm64 \
            artifacts/sift-windows-x64.exe/sift-windows-x64.exe \
            artifacts/sift-windows-arm64.exe/sift-windows-arm64.exe \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
